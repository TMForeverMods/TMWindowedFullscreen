executable: TMWindowedFullscreen.dll
changelog: '- 1.0: borderless ("windowed fullscreen") mode for TrackMania Forever through a Direct3D 9 proxy. Hooks both mode-switch chokepoints - IDirect3D9::CreateDevice and IDirect3DDevice9::Reset (the Alt+Enter fullscreen/windowed toggle) - to force a windowed swap chain at the desktop resolution; the game window is dressed as a WS_POPUP covering the monitor and the game is made to adopt the monitor client size (WM_EXITSIZEMOVE) so it does not fight the change with a device-reset loop. Works standalone (d3d9.dll proxy) or through the ModLoader (IAT hook). No binary patches, no fixed addresses.'
